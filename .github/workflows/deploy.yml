# Publica la app en Firebase (cuadro-usis.web.app) y las reglas de seguridad cada vez que cambia la rama main.
name: Publicar en Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar archivos de la web
        run: |
          rm -rf public && mkdir public
          cp index.html setup.html sw.js manifest.webmanifest public/
          cp -r icons public/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar web y reglas
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT; no se publica todavía."; exit 0; fi
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13.29.1 deploy --only hosting,firestore:rules --project cuadro-usis --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
